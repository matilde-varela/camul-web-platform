  <!--
    Página de passagem para ligações antigas (licao.html?n=2).
    Cada lição tem agora a sua página: licao-1.html … licao-5.html.
    (Alguns servidores locais, como o «npx serve», redirecionam licao.html para /licao e perdem o «?n=».)
  -->
  <script>
    (function () {
      var n = parseInt(new URLSearchParams(location.search).get('n'), 10);
      if (!(n >= 1 && n <= 5)) n = 1;
      location.replace('licao-' + n + '.html' + location.hash);
    })();
  </script>
</head>
