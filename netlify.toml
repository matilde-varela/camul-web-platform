# Configuração do Netlify — site estático, sem passo de compilação.
[build]
  publish = "."

# Cabeçalhos de segurança básicos
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Imagens, vídeos e documentos podem ficar em cache durante uma semana
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Legendas: tipo correto para os navegadores as aceitarem
[[headers]]
  for = "/assets/captions/*"
  [headers.values]
    Content-Type = "text/vtt; charset=utf-8"
